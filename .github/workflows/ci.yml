name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    uses: publicdomainrelay/socialweb-computer/.github/workflows/submodule-ci.yml@main
    with:
      run: deno check hono-package-registry/main.ts

  test:
    uses: publicdomainrelay/socialweb-computer/.github/workflows/submodule-ci.yml@main
    with:
      run: deno test -A hono-package-registry/test.ts

  integration:
    uses: publicdomainrelay/socialweb-computer/.github/workflows/submodule-ci.yml@main
    with:
      run: |
        git config --global user.email "ci@test.com"
        git config --global user.name "CI Test"
        deno test -A --no-check hono-package-registry/integration_test.ts
